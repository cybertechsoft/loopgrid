[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgrid"
version = "0.8.0"
description = "Python SDK for LoopGrid, the evidence plane for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "LoopGrid"}]
dependencies = ["httpx>=0.27,<1"]
keywords = ["ai", "agents", "evidence", "audit", "provenance", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://loopgrid.io"
Repository = "https://github.com/cybertechsoft/loopgrid"

[tool.setuptools.packages.find]
where = ["."]
include = ["loopgrid*"]
